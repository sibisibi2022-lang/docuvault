# Defaults shared by every profile. Nothing secret lives in this file:
# each value below either has a safe default or must be supplied by the
# environment. See .env.example in the backend root.

spring:
  application:
    name: docuvault-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Neon's free tier allows a small connection budget, and Hikari holding
      # idle connections open is what burns the 100 compute-hours/month.
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:0}
      idle-timeout: 30000
      connection-timeout: 30000

  jpa:
    open-in-view: false          # no lazy loading in the view layer
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc.batch_size: 25
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_FILE_SIZE:25MB}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
  forward-headers-strategy: framework   # correct scheme/host behind a PaaS proxy

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

docuvault:
  jwt:
    # No default on purpose: the app must refuse to start without a real secret.
    secret: ${JWT_SECRET}
    issuer: docuvault
    access-token-ttl: ${JWT_TTL:PT1H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    # "local" writes to disk (development only — a PaaS filesystem is ephemeral).
    # "s3" targets any S3-compatible bucket: Cloudflare R2, Supabase, MinIO, AWS.
    type: ${STORAGE_TYPE:local}
    local-directory: ${STORAGE_DIR:./storage}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:auto}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  upload:
    allowed-content-types: >-
      application/pdf,
      image/png,image/jpeg,image/gif,image/webp,
      text/plain,text/csv,
      application/msword,
      application/vnd.openxmlformats-officedocument.wordprocessingml.document,
      application/vnd.ms-excel,
      application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
      application/vnd.ms-powerpoint,
      application/vnd.openxmlformats-officedocument.presentationml.presentation

logging:
  level:
    com.docuvault: ${LOG_LEVEL:INFO}
