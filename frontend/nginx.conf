server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API lives in a sibling container. Proxying it here keeps the browser
    # on a single origin, so no CORS configuration is involved at all.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Uploads stream through here, so the default 1 MB body cap has to go
        # up to match the API's own 25 MB limit.
        client_max_body_size 25m;
        proxy_read_timeout   300s;
    }

    # Hashed filenames never change behind a given URL.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: there is no file at /documents, so every unmatched path
    # must return index.html and let the router decide. index.html itself is
    # never cached, or users keep running the previous build.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
