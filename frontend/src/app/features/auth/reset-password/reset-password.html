<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">

    <h1 class="text-3xl font-bold text-center text-gray-800">DocuVault</h1>
    <p class="text-center text-gray-500 mt-2">Create a new password</p>

    @if (!token) {
      <div class="mt-6 p-3 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-center text-sm text-red-600">
          The reset link is missing its token. Please request a new link.
        </p>
        <div class="text-center mt-3">
          <a routerLink="/forgot-password"
             class="text-blue-600 font-medium hover:underline text-sm">
            Request a new reset link
          </a>
        </div>
      </div>
    }

    @if (token) {
      <form class="mt-8" (ngSubmit)="resetPassword()">

        <div class="mb-4">
          <label for="newPassword"
                 class="block text-sm font-medium text-gray-700 mb-2">
            New password
          </label>
          <input
            id="newPassword"
            type="password"
            name="newPassword"
            [(ngModel)]="newPassword"
            required
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
            placeholder="Minimum 8 characters"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div class="mb-6">
          <label for="confirmPassword"
                 class="block text-sm font-medium text-gray-700 mb-2">
            Confirm password
          </label>
          <input
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            autocomplete="new-password"
            placeholder="Re-enter your new password"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <button
          type="submit"
          [disabled]="loading"
          class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50 transition"
        >
          {{ loading ? 'Updating...' : 'Reset Password' }}
        </button>

        @if (message) {
          <div class="mt-4 p-3 bg-green-50 border border-green-200 rounded-lg">
            <p class="text-center text-sm text-green-700 font-medium">
              {{ message }}
            </p>
            <p class="text-center text-xs text-green-600 mt-1">
              Redirecting to login...
            </p>
          </div>
        }

        @if (error) {
          <div class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg">
            <p class="text-center text-sm text-red-600">{{ error }}</p>
          </div>
        }

      </form>
    }

    <p class="text-center mt-6 text-sm text-gray-600">
      <a routerLink="/forgot-password"
         class="text-blue-600 font-medium hover:underline">
        Request a new reset link
      </a>
    </p>

  </div>
</div>
