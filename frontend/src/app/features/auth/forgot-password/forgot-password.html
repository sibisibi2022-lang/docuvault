<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">

    <h1 class="text-3xl font-bold text-center text-gray-800">DocuVault</h1>
    <p class="text-center text-gray-500 mt-2">Forgot your password?</p>
    <p class="text-center text-gray-400 text-sm mt-1">
      Enter your registered email and we will send you a reset link.
    </p>

    <form class="mt-8" (ngSubmit)="requestReset()">
      <div class="mb-5">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Registered email
        </label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          placeholder="Enter your email"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50 transition"
      >
        {{ loading ? 'Sending...' : 'Send Reset Link' }}
      </button>

      @if (message) {
        <div class="mt-4 p-3 bg-green-50 border border-green-200 rounded-lg">
          <p class="text-center text-sm text-green-700 font-medium">{{ message }}</p>
          <p class="text-center text-xs text-green-600 mt-1">
            Check your backend terminal for the reset link.
          </p>
        </div>
      }

      @if (error) {
        <div class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg">
          <p class="text-center text-sm text-red-600">{{ error }}</p>
        </div>
      }
    </form>

    <p class="text-center mt-6 text-sm text-gray-600">
      Remember your password?
      <a routerLink="/login" class="text-blue-600 font-medium hover:underline">
        Back to Login
      </a>
    </p>

  </div>
</div>
