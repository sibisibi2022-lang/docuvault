<div class="min-h-screen">
  <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex h-14 max-w-7xl items-center gap-4 px-4 sm:px-6">
      <a routerLink="/dashboard" class="flex items-center gap-2 font-semibold text-slate-900">
        <span class="grid h-8 w-8 place-items-center rounded-lg bg-brand-600 text-sm font-bold text-white">
          DV
        </span>
        <span>DocuVault</span>
      </a>

      <nav class="ml-4 hidden items-center gap-1 md:flex">
        <a routerLink="/dashboard" routerLinkActive="bg-slate-100 text-slate-900"
           class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100">
          Dashboard
        </a>
        <a routerLink="/documents" routerLinkActive="bg-slate-100 text-slate-900"
           class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100">
          Documents
        </a>
        @if (auth.canManageWorkspace()) {
          <a routerLink="/categories" routerLinkActive="bg-slate-100 text-slate-900"
             class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100">
            Categories
          </a>
          <a routerLink="/audit-logs" routerLinkActive="bg-slate-100 text-slate-900"
             class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100">
            Audit log
          </a>
        }
      </nav>

      <div class="ml-auto flex items-center gap-2">
        <span class="badge hidden bg-brand-50 text-brand-700 sm:inline-flex">{{ auth.role() }}</span>

        <div class="relative">
          <button type="button" (click)="toggleMenu()"
                  class="flex items-center gap-2 rounded-lg px-2 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
                  [attr.aria-expanded]="menuOpen()" aria-haspopup="menu">
            <span class="grid h-7 w-7 place-items-center rounded-full bg-slate-200 text-xs font-semibold text-slate-700">
              {{ auth.displayName().charAt(0).toUpperCase() }}
            </span>
            <span class="hidden sm:inline">{{ auth.displayName() }}</span>
          </button>

          @if (menuOpen()) {
            <div class="absolute right-0 mt-1 w-48 overflow-hidden rounded-lg border border-slate-200 bg-white shadow-lg"
                 role="menu">
              <a routerLink="/profile" (click)="toggleMenu()"
                 class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">Profile</a>
              <button type="button" (click)="signOut()"
                      class="block w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-red-50">
                Sign out
              </button>
            </div>
          }
        </div>

        <button type="button" (click)="toggleNav()"
                class="rounded-lg p-2 text-slate-600 hover:bg-slate-100 md:hidden"
                aria-label="Toggle navigation">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>

    @if (navOpen()) {
      <nav class="border-t border-slate-200 bg-white px-4 py-2 md:hidden">
        <a routerLink="/dashboard" (click)="closeNav()"
           class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">Dashboard</a>
        <a routerLink="/documents" (click)="closeNav()"
           class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">Documents</a>
        @if (auth.canManageWorkspace()) {
          <a routerLink="/categories" (click)="closeNav()"
             class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">Categories</a>
          <a routerLink="/audit-logs" (click)="closeNav()"
             class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">Audit log</a>
        }
      </nav>
    }
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6">
    <router-outlet />
  </main>
</div>
